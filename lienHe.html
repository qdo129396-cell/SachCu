<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Nhà sách cũ</title>
</head>
<body>

    <header>
        <img src="Img/logo_300_240.jpg" alt="Logo nhà sách" width="150">
        <h1>NHÀ SÁCH CŨ</h1>
        <p>Chúng tôi luôn sẵn sàng hỗ trợ bạn</p>
    </header>

    <nav>
        <a href="index.html">Trang chủ</a> |
        <a href="thoiGianMoCua.html">Thời gian mở cửa</a> |
        <a href="lienHe.html">Liên hệ</a>
    </nav>

    <hr>

    <main>
        <h2>Thông tin liên hệ</h2>

        <p>Địa chỉ: Đà Lạt, Lâm Đồng, Việt Nam</p>
        <p>Email: nhasachcu@gmail.com</p>
        <p>Điện thoại: 0123456789</p>

        <section>
            <h2>Gửi thông tin cho chúng tôi</h2>

            <form action="https://httpbin.org/get" method="get">

                <p>
                    <label for="hoten">Họ và tên:</label><br>
                    <input type="text" id="hoten" name="hoten"
                           placeholder="Nhập họ và tên" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="Nhập email" required>
                </p>

                <p>
                    <label for="sdt">Số điện thoại:</label><br>
                    <input type="tel" id="sdt" name="sdt"
                           placeholder="Nhập số điện thoại">
                </p>

                <p>
                    <label for="noidung">Nội dung liên hệ:</label><br>
                    <textarea id="noidung" name="noidung"
                              rows="5" cols="40"
                              placeholder="Nhập nội dung..." required></textarea>
                </p>

                <button type="submit">Gửi liên hệ</button>
                <button type="reset">Nhập lại</button>

            </form>
        </section>
    </main>
